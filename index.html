<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套房清潔管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F0F0F;
  --surface:#1A1A1A;
  --surface2:#222;
  --border:#2E2E2E;
  --accent:#C8A96E;
  --accent2:#8FBF6A;
  --danger:#E05A5A;
  --text:#F0EDE8;
  --muted:#888;
  --radius:12px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ════ ADMIN ════ */
#page-admin{display:none;padding:32px 20px 60px;max-width:520px;margin:0 auto}
#page-admin.active{display:block}

.admin-logo{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.admin-logo .tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
.admin-logo h1{font-size:22px;font-weight:900;color:var(--text)}
.admin-logo p{font-size:12px;color:var(--muted);margin-top:4px}

.room-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.room-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:28px}
.room-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;font-weight:500}
.room-btn:hover{border-color:var(--accent);color:var(--accent)}
.room-btn.selected{background:var(--accent);border-color:var(--accent);color:#0F0F0F;font-weight:700}

.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.form-card h3{font-size:13px;color:var(--accent);margin-bottom:16px;letter-spacing:1px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:64px;font-size:13px}

.btn-generate{width:100%;padding:16px;background:var(--accent);color:#0F0F0F;border:none;border-radius:var(--radius);font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-generate:hover{opacity:.88}
.btn-generate:disabled{opacity:.4;cursor:not-allowed}

.link-result{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:16px;margin-top:16px;display:none}
.link-result.show{display:block}
.link-result .lbl{font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:8px}
.link-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text);word-break:break-all;margin-bottom:10px;line-height:1.7}
.btn-copy{width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-copy.copied{border-color:var(--accent2);color:var(--accent2)}

/* ════ CLEANER ════ */
#page-cleaner{display:none;padding:0 0 60px;max-width:620px;margin:0 auto}
#page-cleaner.active{display:block}

.cleaner-hero{background:linear-gradient(135deg,#1a1a0f,#0f1a0a);border-bottom:1px solid var(--border);padding:28px 20px 24px;position:relative;overflow:hidden}
.cleaner-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(200,169,110,.12),transparent 70%);pointer-events:none}
.hero-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.hero-room{font-size:36px;font-weight:900;color:var(--text);letter-spacing:-1px;line-height:1;margin-bottom:4px}
.hero-date{font-size:12px;color:var(--muted)}

.pw-card{margin:16px 20px;background:linear-gradient(135deg,#1f1a0d,#1a1f0d);border:1px solid rgba(200,169,110,.35);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px}
.pw-icon{font-size:28px}
.pw-label{font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.pw-code{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--text);letter-spacing:5px}
.pw-note{font-size:11px;color:var(--muted);margin-top:2px}

.note-card{margin:0 20px 14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6;display:none}
.note-card.show{display:block}

.progress-wrap{margin:0 20px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .4s ease;width:0%}
.progress-text{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);font-weight:500;white-space:nowrap}

.cl-section{margin:0 20px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cl-section-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.cl-section-icon{font-size:16px}
.cl-section-title{font-size:14px;font-weight:700;flex:1;color:var(--text)}
.cl-section-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:20px}

.check-item{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.check-item:last-child{border-bottom:none}
.check-item:hover{background:rgba(255,255,255,.03)}
.check-item.done{background:rgba(143,191,106,.06)}
.check-box{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--surface2)}
.check-item.done .check-box{background:var(--accent2);border-color:var(--accent2)}
.checkmark{color:#0F0F0F;font-size:11px;display:none;font-weight:700}
.check-item.done .checkmark{display:block}
.check-content{flex:1}
.check-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.check-item.done .check-name{color:var(--muted);text-decoration:line-through}
.check-note{font-size:11px;color:var(--muted);margin-top:2px}

/* ════ 拍照上傳區塊 ════ */
.photo-section{margin:0 20px 12px}
.photo-section-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
.photo-section-title{font-size:14px;font-weight:700;flex:1;color:var(--text)}

.photo-upload-area{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:16px}

.photo-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-photo{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.btn-photo:hover{border-color:var(--accent);color:var(--accent)}
.btn-photo .icon{font-size:18px}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .del-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-thumb .del-btn:hover{background:var(--danger)}

.photo-caption-wrap{margin-bottom:12px}
.photo-caption-wrap label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.photo-caption-wrap textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text);outline:none;resize:none;height:60px;transition:border-color .2s}
.photo-caption-wrap textarea:focus{border-color:var(--accent)}

.btn-send-tg{width:100%;padding:14px;background:linear-gradient(135deg,#2AABEE,#229ED9);color:#fff;border:none;border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-send-tg:hover{opacity:.88}
.btn-send-tg:disabled{opacity:.4;cursor:not-allowed}
.btn-send-tg .tg-icon{font-size:18px}

.tg-status{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:12px;text-align:center;display:none}
.tg-status.show{display:block}
.tg-status.sending{background:rgba(200,169,110,.12);color:var(--accent);border:1px solid rgba(200,169,110,.3)}
.tg-status.success{background:rgba(143,191,106,.12);color:var(--accent2);border:1px solid rgba(143,191,106,.3)}
.tg-status.error{background:rgba(224,90,90,.12);color:var(--danger);border:1px solid rgba(224,90,90,.3)}

/* hidden file inputs */
#fileInputCamera,#fileInputGallery{display:none}

.done-banner{margin:16px 20px;background:linear-gradient(135deg,rgba(143,191,106,.15),rgba(200,169,110,.1));border:1px solid var(--accent2);border-radius:var(--radius);padding:20px;text-align:center;display:none}
.done-banner.show{display:block}
.done-emoji{font-size:36px;margin-bottom:8px}
.done-banner h3{font-size:16px;font-weight:700;color:var(--accent2);margin-bottom:4px}
.done-banner p{font-size:12px;color:var(--muted)}

.btn-reset{display:block;width:calc(100% - 40px);margin:12px 20px 0;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.btn-reset:hover{border-color:var(--danger);color:var(--danger)}

@media(max-width:400px){
  .room-grid{gap:7px}
  .room-btn{font-size:12px;padding:12px 4px}
  .pw-code{font-size:20px}
  .photo-grid{grid-template-columns:repeat(2,1fr)}
}
@media print{
  .btn-reset,.photo-section{display:none}
  body{background:#fff;color:#000}
  .cleaner-hero{background:#f5f2ec!important;border:none}
  .cl-section,.pw-card{border:1px solid #ccc!important}
  .check-box{border:2px solid #999!important;background:#fff!important}
  .check-item.done .check-box{background:#4a7a25!important}
}
</style>
</head>
<body>

<!-- ═══ ADMIN ═══ -->
<div id="page-admin">
  <div class="admin-logo">
    <div class="tag">Admin Dashboard</div>
    <h1>🏢 套房清潔管理後台</h1>
    <p>選擇房間 → 輸入密碼 → 產生清潔連結傳給清潔人員</p>
  </div>

  <div class="room-label">選擇房間</div>
  <div class="room-grid" id="roomGrid"></div>

  <div class="form-card">
    <h3>⚙️ 房間設定</h3>
    <div class="field">
      <label>已選房間</label>
      <input type="text" id="selectedRoom" readonly placeholder="請點選上方房間" style="cursor:default;color:var(--accent);font-family:'DM Mono',monospace;font-size:16px;font-weight:500">
    </div>
    <div class="field">
      <label>門鎖密碼</label>
      <input type="text" id="lockPw" placeholder="例：1234 或 A5678" maxlength="20">
    </div>
    <div class="field">
      <label>給清潔人員的備註（選填）</label>
      <textarea id="adminNote" placeholder="例：廚房抽油煙機特別注意、浴室有漏水請回報..."></textarea>
    </div>
  </div>

  <button class="btn-generate" id="btnGenerate" onclick="generateLink()" disabled>產生清潔頁連結</button>

  <div class="link-result" id="linkResult">
    <div class="lbl">✅ 連結已產生 — 複製後傳給清潔人員</div>
    <div class="link-box" id="linkBox"></div>
    <button class="btn-copy" id="btnCopy" onclick="copyLink()">📋 複製連結</button>
  </div>
</div>

<!-- ═══ CLEANER ═══ -->
<div id="page-cleaner">

  <div class="cleaner-hero">
    <div class="hero-tag">清潔任務單</div>
    <div class="hero-room" id="heroRoom">—</div>
    <div class="hero-date" id="heroDate"></div>
  </div>

  <div class="pw-card">
    <div class="pw-icon">🔐</div>
    <div>
      <div class="pw-label">門鎖密碼</div>
      <div class="pw-code" id="heroPassword">—</div>
      <div class="pw-note">輸入此密碼開門</div>
    </div>
  </div>

  <div class="note-card" id="heroNote"></div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <div id="cleanerSections"></div>

  <!-- ════ 拍照上傳 + Telegram 推播 ════ -->
  <div class="photo-section">
    <div class="photo-section-header">
      <span style="font-size:16px">📸</span>
      <span class="photo-section-title">清潔完成照片</span>
    </div>
    <div class="photo-upload-area">
      <div class="photo-btn-row">
        <button class="btn-photo" onclick="document.getElementById('fileInputCamera').click()">
          <span class="icon">📷</span> 拍照
        </button>
        <button class="btn-photo" onclick="document.getElementById('fileInputGallery').click()">
          <span class="icon">🖼️</span> 相簿選取
        </button>
      </div>

      <!-- 拍照（優先開相機） -->
      <input type="file" id="fileInputCamera" accept="image/*" capture="environment" multiple onchange="handlePhotos(this)">
      <!-- 相簿選取（不強制開相機） -->
      <input type="file" id="fileInputGallery" accept="image/*" multiple onchange="handlePhotos(this)">

      <div class="photo-grid" id="photoGrid"></div>

      <div class="photo-caption-wrap">
        <label>附加說明（選填）</label>
        <textarea id="photoCaption" placeholder="例：浴室磁磚縫有輕微黴斑，已清潔但建議下次補強..."></textarea>
      </div>

      <button class="btn-send-tg" id="btnSendTg" onclick="sendToTelegram()">
        <span class="tg-icon">✈️</span> 傳送至 Telegram 通知房東
      </button>

      <div class="tg-status" id="tgStatus"></div>
    </div>
  </div>

  <div class="done-banner" id="doneBanner">
    <div class="done-emoji">🎉</div>
    <h3>清潔完成！</h3>
    <p>請截圖此頁面傳給房東確認，謝謝！</p>
  </div>

  <button class="btn-reset" onclick="resetAll()">重置所有勾選</button>
</div>

<script>

let selectedRoom = '';
let checkStates  = {};
let totalItems   = 0;

let uploadedPhotos = []; // [{dataUrl, file}]

/* ── Router ── */
function route() {
  const hash = decodeURIComponent(location.hash);
  if (hash.startsWith('#clean/')) {
    showCleanerPage(parseHash(hash.slice(7)));
  } else {
    showAdminPage();
  }
}

function parseHash(str) {
  const obj = {};
  str.split('&').forEach(p => {
    const i = p.indexOf('=');
    if (i > 0) obj[p.slice(0,i)] = decodeURIComponent(p.slice(i+1));
  });
  return obj;
}

/* ── Admin ── */
function showAdminPage() {
  document.getElementById('page-admin').classList.add('active');
  document.getElementById('page-cleaner').classList.remove('active');
}

function buildRoomGrid() {
  const grid = document.getElementById('roomGrid');
  ROOMS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'room-btn';
    btn.textContent = r;
    btn.id = 'room-' + r;
    btn.onclick = () => selectRoom(r);
    grid.appendChild(btn);
  });
}

function selectRoom(r) {
  selectedRoom = r;
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('room-' + r).classList.add('selected');
  document.getElementById('selectedRoom').value = r + ' 室';
  document.getElementById('btnGenerate').disabled = false;
  document.getElementById('linkResult').classList.remove('show');
}

function generateLink() {
  const pw   = document.getElementById('lockPw').value.trim();
  const note = document.getElementById('adminNote').value.trim();
  if (!selectedRoom) { alert('請先選擇房間'); return; }
  if (!pw) { alert('請輸入門鎖密碼'); return; }
  const base = location.href.split('#')[0];
  let hash = `#clean/room=${encodeURIComponent(selectedRoom)}&pw=${encodeURIComponent(pw)}`;
  if (note) hash += `&note=${encodeURIComponent(note)}`;
  const url = base + hash;
  document.getElementById('linkBox').textContent = url;
  document.getElementById('linkResult').classList.add('show');
  document.getElementById('btnCopy').textContent = '📋 複製連結';
  document.getElementById('btnCopy').classList.remove('copied');
}

function copyLink() {
  const url = document.getElementById('linkBox').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = '✅ 已複製！';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 複製連結'; btn.classList.remove('copied'); }, 2500);
  });
}

/* ── Cleaner ── */
function showCleanerPage(params) {
  document.getElementById('page-admin').classList.remove('active');
  document.getElementById('page-cleaner').classList.add('active');

  const room = params.room || '—';
  const pw   = params.pw   || '—';
  const note = params.note || '';

  currentRoom = room;
  const now = new Date();
  currentDate = now.getFullYear() + '/' +
    String(now.getMonth()+1).padStart(2,'0') + '/' +
    String(now.getDate()).padStart(2,'0');

  document.getElementById('heroRoom').textContent = room + ' 室';
  document.getElementById('heroPassword').textContent = pw;
  document.getElementById('heroDate').textContent = currentDate;

  const noteEl = document.getElementById('heroNote');
  if (note) { noteEl.textContent = '📌 ' + note; noteEl.classList.add('show'); }
  else { noteEl.classList.remove('show'); }

  buildChecklist();
  uploadedPhotos = [];
  renderPhotoGrid();
  setTgStatus('');
}

function buildChecklist() {
  checkStates = {}; totalItems = 0;
  const container = document.getElementById('cleanerSections');
  container.innerHTML = '';

  SECTIONS.forEach((sec, si) => {
    totalItems += sec.items.length;
    sec.items.forEach((_, ii) => { checkStates[`${si}-${ii}`] = false; });

    const div = document.createElement('div');
    div.className = 'cl-section';
    div.innerHTML = `
      <div class="cl-section-header">
        <span class="cl-section-icon">${sec.icon}</span>
        <span class="cl-section-title">${sec.title}</span>
        <span class="cl-section-count" id="sc-${si}">0/${sec.items.length}</span>
      </div>
      ${sec.items.map((item, ii) => `
        <div class="check-item" id="ci-${si}-${ii}" onclick="toggleItem(${si},${ii})">
          <div class="check-box"><span class="checkmark">✓</span></div>
          <div class="check-content">
            <div class="check-name">${item.name}</div>
            ${item.note ? `<div class="check-note">💡 ${item.note}</div>` : ''}
          </div>
        </div>
      `).join('')}
    `;
    container.appendChild(div);
  });
  updateProgress();
}

function toggleItem(si, ii) {
  const key = `${si}-${ii}`;
  checkStates[key] = !checkStates[key];
  document.getElementById(`ci-${si}-${ii}`).classList.toggle('done', checkStates[key]);
  updateSectionCount(si);
  updateProgress();
}

function updateSectionCount(si) {
  let done = 0;
  SECTIONS[si].items.forEach((_, ii) => { if (checkStates[`${si}-${ii}`]) done++; });
  document.getElementById(`sc-${si}`).textContent = `${done}/${SECTIONS[si].items.length}`;
}

function updateProgress() {
  const done = Object.values(checkStates).filter(Boolean).length;
  const pct  = totalItems ? Math.round(done / totalItems * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${totalItems} 項完成`;
  document.getElementById('doneBanner').classList.toggle('show', done === totalItems && totalItems > 0);
}

function resetAll() {
  if (!confirm('確定要重置所有勾選？')) return;
  Object.keys(checkStates).forEach(k => { checkStates[k] = false; });
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('done'));
  SECTIONS.forEach((_, si) => updateSectionCount(si));
  updateProgress();
}

/* ── 照片處理 ── */
function handlePhotos(input) {
  const files = Array.from(input.files);
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      uploadedPhotos.push({ dataUrl: e.target.result, file });
      renderPhotoGrid();
    };
    reader.readAsDataURL(file);
  });
  input.value = ''; // 允許重複選同一張
}

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  grid.innerHTML = '';
  uploadedPhotos.forEach((p, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb';
    wrap.innerHTML = `
      <img src="${p.dataUrl}" alt="清潔照片 ${idx+1}">
      <button class="del-btn" onclick="removePhoto(${idx})">✕</button>
    `;
    grid.appendChild(wrap);
  });
}

function removePhoto(idx) {
  uploadedPhotos.splice(idx, 1);
  renderPhotoGrid();
}

/* ── Telegram 推播 ── */
function setTgStatus(type, msg) {
  const el = document.getElementById('tgStatus');
  el.className = 'tg-status' + (type ? ' show ' + type : '');
  el.textContent = msg || '';
}

async function sendToTelegram() {
  const done    = Object.values(checkStates).filter(Boolean).length;
  const caption = document.getElementById('photoCaption').value.trim();

  const msgLines = [
    `🏠 *${currentRoom} 室 清潔完成通知*`,
    `📅 日期：${currentDate}`,
    `✅ 完成項目：${done} / ${totalItems} 項`,
    caption ? `📝 備註：${caption}` : '',
    uploadedPhotos.length ? `📸 附圖：${uploadedPhotos.length} 張` : '（無附圖）',
  ].filter(Boolean).join('\n');

  const btn = document.getElementById('btnSendTg');
  btn.disabled = true;
  setTgStatus('sending', '⏳ 傳送中，請稍候...');

  try {
    // 1. 先傳文字訊息
    const textRes = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TG_CHAT,
        text: msgLines,
        parse_mode: 'Markdown'
      })
    });
    const textData = await textRes.json();
    if (!textData.ok) throw new Error(textData.description || '傳送失敗');

    // 2. 逐一傳送照片
    for (let i = 0; i < uploadedPhotos.length; i++) {
      const p    = uploadedPhotos[i];
      const form = new FormData();
      form.append('chat_id', TG_CHAT);
      form.append('photo', p.file, p.file.name || `photo${i+1}.jpg`);
      if (i === 0 && caption) form.append('caption', `📸 ${currentRoom}室 清潔照片`);

      const photoRes = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: form
      });
      const photoData = await photoRes.json();
      if (!photoData.ok) throw new Error(`第 ${i+1} 張照片上傳失敗：${photoData.description}`);
    }

    setTgStatus('success', `✅ 已成功傳送到 Telegram！${uploadedPhotos.length ? `（含 ${uploadedPhotos.length} 張照片）` : ''}`);
  } catch (err) {
    setTgStatus('error', '❌ 傳送失敗：' + err.message);
  } finally {
    btn.disabled = false;
  }
}

buildRoomGrid();
window.addEventListener('hashchange', route);
route();
</script>
