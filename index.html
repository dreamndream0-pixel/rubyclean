<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套房清潔管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F2;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E2DDD8;
  --accent:#8B6340;--accent-light:#F5EDE3;--accent2:#4A7A35;--accent2-light:#EAF3E5;
  --danger:#C0392B;--danger-light:#FDF0EE;--text:#1A1714;--muted:#8A8480;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#page-login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#page-login.active{display:flex}
.login-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:36px 28px;max-width:340px;width:100%;box-shadow:var(--shadow-md);text-align:center}
.login-icon{font-size:40px;margin-bottom:14px}
.login-card h2{font-size:20px;font-weight:900;margin-bottom:5px}
.login-card p{font-size:12px;color:var(--muted);margin-bottom:22px}
.login-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;font-family:'DM Mono',monospace;font-size:20px;color:var(--text);outline:none;text-align:center;letter-spacing:5px;transition:all .2s;margin-bottom:12px}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,99,64,.1)}
.btn-login{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(139,99,64,.25)}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.login-err{font-size:12px;color:var(--danger);margin-top:8px;min-height:18px}

/* ADMIN */
#page-admin{display:none;padding:28px 20px 60px;max-width:520px;margin:0 auto}
#page-admin.active{display:block}
.btn-logout{position:fixed;top:14px;right:14px;padding:7px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;box-shadow:var(--shadow);transition:all .2s;z-index:100;font-family:'Noto Sans TC',sans-serif}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}
.admin-logo{text-align:center;margin-bottom:24px;padding-bottom:22px;border-bottom:2px solid var(--border)}
.admin-logo .tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;background:var(--accent-light);display:inline-block;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.admin-logo h1{font-size:22px;font-weight:900;margin-top:8px}
.admin-logo p{font-size:12px;color:var(--muted);margin-top:4px}

/* Tabs */
.tab-nav{display:flex;gap:5px;margin-bottom:20px;background:var(--surface2);padding:5px;border-radius:12px}
.tab-btn{flex:1;padding:10px 6px;border:none;border-radius:9px;font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;background:transparent;color:var(--muted)}
.tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Room/Building */
.room-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.building-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.building-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:13px 10px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:600;box-shadow:var(--shadow);line-height:1.4}
.building-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);transform:translateY(-1px)}
.building-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(139,99,64,.3);transform:translateY(-1px)}
.room-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.room-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.room-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);transform:translateY(-1px)}
.room-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(139,99,64,.3);transform:translateY(-1px)}

/* Form */
.form-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.form-card h3{font-size:11px;color:var(--accent);margin-bottom:16px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--text);outline:none;transition:all .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(139,99,64,.1)}
.field textarea{resize:vertical;min-height:64px;font-size:13px}
.btn-generate{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(139,99,64,.25)}
.btn-generate:hover{opacity:.9;transform:translateY(-1px)}
.btn-generate:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.link-result{background:var(--accent-light);border:1.5px solid var(--accent);border-radius:var(--radius);padding:16px;margin-top:16px;display:none;box-shadow:var(--shadow)}
.link-result.show{display:block}
.link-result .lbl{font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:8px}
.link-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text);word-break:break-all;margin-bottom:10px;line-height:1.7}
.btn-copy{width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-copy.copied{border-color:var(--accent2);color:var(--accent2)}

/* EDITOR */
.editor-section{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.editor-sec-header{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--surface2);border-bottom:1.5px solid var(--border)}
.editor-sec-chevron{font-size:12px;color:var(--muted);transition:transform .25s ease;flex-shrink:0;cursor:pointer;padding:4px}
.editor-section.collapsed .editor-sec-chevron{transform:rotate(-90deg)}
.editor-sec-body{transition:max-height .3s ease,opacity .25s ease;overflow:hidden;max-height:3000px;opacity:1}
.editor-section.collapsed .editor-sec-body{max-height:0;opacity:0}
.editor-section.collapsed .editor-sec-header{border-bottom:none}
.editor-sec-icon{font-size:16px;cursor:pointer;user-select:none;padding:4px;border-radius:6px;transition:background .2s}
.editor-sec-icon:hover{background:var(--border)}
.editor-sec-title-input{flex:1;border:none;background:transparent;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;color:var(--text);outline:none;min-width:0}
.editor-sec-title-input:focus{background:var(--accent-light);border-radius:6px;padding:2px 8px}
.btn-del-sec{padding:5px 10px;background:var(--danger-light);border:1px solid rgba(192,57,43,.2);border-radius:6px;color:var(--danger);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-del-sec:hover{background:var(--danger);color:#fff}
.editor-items{padding:6px 0}
.editor-item{display:flex;align-items:flex-start;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border)}
.editor-item:last-child{border-bottom:none}
.editor-item-inputs{flex:1;display:flex;flex-direction:column;gap:5px}
.editor-item-name{width:100%;border:1.5px solid transparent;border-radius:8px;padding:6px 10px;font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;color:var(--text);background:transparent;outline:none;transition:all .2s}
.editor-item-name:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px rgba(139,99,64,.08)}
.editor-item-note{width:100%;border:1.5px solid transparent;border-radius:8px;padding:5px 10px;font-family:'Noto Sans TC',sans-serif;font-size:11px;color:var(--muted);background:transparent;outline:none;transition:all .2s}
.editor-item-note:focus{border-color:var(--border);background:var(--surface2)}
.btn-del-item{flex-shrink:0;width:26px;height:26px;background:transparent;border:none;color:var(--border);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .2s;margin-top:2px}
.btn-del-item:hover{background:var(--danger-light);color:var(--danger)}
.btn-add-item{width:100%;padding:10px;background:transparent;border:1.5px dashed var(--border);border-radius:10px;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;margin:4px 0 0}
.btn-add-item:hover{border-color:var(--accent2);color:var(--accent2);background:var(--accent2-light)}
.editor-footer{display:flex;gap:10px;margin-top:4px}
.btn-add-section{flex:1;padding:13px;background:var(--surface);border:1.5px dashed var(--accent);border-radius:var(--radius);color:var(--accent);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-add-section:hover{background:var(--accent-light)}
.btn-reset-default{padding:13px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-reset-default:hover{border-color:var(--danger);color:var(--danger)}
.saved-note{font-size:11px;color:var(--accent2);text-align:center;padding:10px;opacity:0;transition:opacity .4s}
.saved-note.show{opacity:1}

/* Toggle switch */
.toggle-wrap{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg)}
.toggle-label{font-size:12px;color:var(--muted);flex:1}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:all .25s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-slider{background:var(--accent2)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}

/* Confirm dialog */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.show{display:flex}
.confirm-card{background:var(--surface);border-radius:var(--radius);padding:28px 24px;max-width:320px;width:100%;box-shadow:var(--shadow-md);text-align:center}
.confirm-icon{font-size:32px;margin-bottom:12px}
.confirm-card h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:8px}
.confirm-card p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}
.btn-confirm-ok{flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-confirm-ok:hover{opacity:.88}
.btn-confirm-cancel{flex:1;padding:12px;background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-confirm-cancel:hover{border-color:var(--danger);color:var(--danger)}

/* Unsaved dot on tab */
.tab-dirty::after{content:'';display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-left:5px;vertical-align:middle}

/* Disabled section in cleaner */
.cl-section.sec-disabled{opacity:.38;pointer-events:none}

/* CLEANER */
#page-cleaner{display:none;padding:0 0 60px;max-width:620px;margin:0 auto}
#page-cleaner.active{display:block}
.cleaner-hero{background:linear-gradient(135deg,#FDF9F4,#F5EDE3);border-bottom:2px solid var(--border);padding:32px 20px 28px;position:relative;overflow:hidden}
.cleaner-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(139,99,64,.12),transparent 70%);pointer-events:none}
.hero-tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;background:rgba(139,99,64,.12);display:inline-block;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.hero-building{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.hero-room{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin-bottom:6px}
.hero-date{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:1px}
.pw-card{margin:16px 20px;background:linear-gradient(135deg,#FFF8F0,#FDF3E8);border:1.5px solid rgba(139,99,64,.25);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-md)}
.pw-icon{font-size:28px}
.pw-label{font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.pw-code{font-family:'DM Mono',monospace;font-size:30px;font-weight:700;color:var(--accent);letter-spacing:6px}
.pw-note{font-size:11px;color:var(--muted);margin-top:2px}
.note-card{margin:0 20px 14px;background:var(--accent-light);border:1px solid rgba(139,99,64,.2);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:13px;color:#5C4A35;line-height:1.6;display:none}
.note-card.show{display:block}
.progress-wrap{margin:0 20px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#C8935A,#5A9E35);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.progress-text{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);font-weight:500;white-space:nowrap}
.cl-section{margin:0 20px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cl-section-header{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--surface2);border-bottom:1.5px solid var(--border);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .15s}
.cl-section-header:hover{background:var(--border)}
.cl-section-icon{font-size:16px}
.cl-section-title{font-size:14px;font-weight:700;flex:1}
.cl-section-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.cl-section-chevron{font-size:12px;color:var(--muted);transition:transform .25s ease;flex-shrink:0}
.cl-section.collapsed .cl-section-chevron{transform:rotate(-90deg)}
.cl-section-body{transition:max-height .3s ease,opacity .25s ease;overflow:hidden;max-height:2000px;opacity:1}
.cl-section.collapsed .cl-section-body{max-height:0;opacity:0}
.cl-section.collapsed .cl-section-header{border-bottom:none}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.check-item:last-child{border-bottom:none}
.check-item:hover{background:var(--surface2)}
.check-item.done{background:var(--accent2-light)}
.check-box{width:20px;height:20px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
.check-item.done .check-box{background:var(--accent2);border-color:var(--accent2);box-shadow:0 2px 6px rgba(74,122,53,.3)}
.checkmark{color:#fff;font-size:11px;display:none;font-weight:800}
.check-item.done .checkmark{display:block}
.check-content{flex:1}
.check-name{font-size:13px;font-weight:500;line-height:1.4}
.check-item.done .check-name{color:var(--muted);text-decoration:line-through}
.check-note{font-size:11px;color:var(--muted);margin-top:2px}

/* PHOTOS */
.photo-section{margin:0 20px 12px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.photo-section-header{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--surface2);border:1.5px solid var(--border);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0}
.photo-section-title{font-size:14px;font-weight:700;flex:1}
.photo-upload-area{background:var(--surface);border:1.5px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:18px}
.photo-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-photo{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.btn-photo:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .del-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(255,255,255,.9);border:none;border-radius:50%;color:#333;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.photo-thumb .del-btn:hover{background:var(--danger);color:#fff}
.photo-thumb .upload-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;opacity:0;transition:opacity .2s}
.photo-thumb.uploading .upload-overlay{opacity:1}
.photo-thumb.uploading .del-btn{display:none}
.photo-thumb.upload-done .upload-overlay{opacity:1;background:rgba(74,122,53,.7)}
.photo-thumb.upload-error .upload-overlay{opacity:1;background:rgba(192,57,43,.7)}
.upload-pct{font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:#fff;line-height:1}
.upload-label{font-size:10px;color:rgba(255,255,255,.85);letter-spacing:.5px}
.upload-bar-wrap{width:70%;height:4px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.upload-bar{height:100%;background:#fff;border-radius:999px;width:0%;transition:width .3s ease}
.upload-icon{font-size:20px}
.photo-caption-wrap{margin-bottom:12px}
.photo-caption-wrap label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.photo-caption-wrap textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text);outline:none;resize:none;height:60px;transition:all .2s}
.photo-caption-wrap textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(139,99,64,.1)}
.btn-send-tg{width:100%;padding:14px;background:linear-gradient(135deg,#2AABEE,#229ED9);color:#fff;border:none;border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-send-tg:hover{opacity:.88}
.btn-send-tg:disabled{opacity:.4;cursor:not-allowed}

/* ── State ── */

/* ── LocalStorage ── */
function loadSections() {
  try { const r = localStorage.getItem('cleaning_sections'); if(r) return JSON.parse(r); } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
}
let pendingSave = null; // holds resolve fn for confirm dialog

function saveSections(skipConfirm) {
  if (skipConfirm) {
    _doSave();
    return;
  }
  showConfirm({
    icon: '💾',
    title: '確認儲存？',

/* Confirm dialog */
function showConfirm({icon, title, msg, okLabel, onOk, onCancel}) {
  const overlay = document.getElementById('confirmOverlay');
  document.getElementById('confirmIcon').textContent = icon || '💾';
  document.getElementById('confirmTitle').textContent = title || '確認';
  document.getElementById('confirmMsg').textContent = msg || '';
  document.getElementById('confirmOk').textContent = okLabel || '確認';
  overlay.classList.add('show');
  const ok = document.getElementById('confirmOk');
  const cancel = document.getElementById('confirmCancel');
  const cleanup = () => { overlay.classList.remove('show'); ok.onclick = null; cancel.onclick = null; };
  ok.onclick = () => { cleanup(); onOk && onOk(); };
  cancel.onclick = () => { cleanup(); onCancel && onCancel(); renderEditor(); };

/* ── Router ── */
function route() {
  const hash = decodeURIComponent(location.hash);
  if(hash.startsWith('#clean/')) {
    document.getElementById('page-login').classList.remove('active');
    document.getElementById('page-admin').classList.remove('active');
    showCleanerPage(parseHash(hash.slice(7)));
  } else {
    document.getElementById('page-cleaner').classList.remove('active');
    if(sessionStorage.getItem('admin_ok')==='1') showAdmin();
    else { document.getElementById('page-login').classList.add('active'); }
  }
}
function parseHash(str) {
  const o={};
  str.split('&').forEach(p=>{ const i=p.indexOf('='); if(i>0) o[p.slice(0,i)]=decodeURIComponent(p.slice(i+1)); });
  return o;
}

/* ── Admin ── */

  document.getElementById('page-login').classList.remove('active');
  document.getElementById('page-cleaner').classList.remove('active');

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(tab==='link'&&i===0)||(tab==='editor'&&i===1)));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='editor') renderEditor();
}
function buildRoomGrid() {
  const g=document.getElementById('buildingGrid'); g.innerHTML='';
  BUILDINGS.forEach(b=>{ const btn=document.createElement('button'); btn.className='building-btn'; btn.textContent=b.label; btn.id='building-'+b.id; btn.onclick=()=>selectBuilding(b.id); g.appendChild(btn); });
}
function selectBuilding(id) {
  currentBuilding=BUILDINGS.find(b=>b.id===id);
  document.querySelectorAll('.building-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('building-'+id).classList.add('selected');
  const g=document.getElementById('roomGrid'); g.innerHTML='';
  currentBuilding.rooms.forEach(r=>{ const btn=document.createElement('button'); btn.className='room-btn'; btn.textContent=r; btn.id='room-'+r; btn.onclick=()=>selectRoom(r); g.appendChild(btn); });
  selectedRoom=''; document.getElementById('selectedRoom').value='';
  document.getElementById('btnGenerate').disabled=true;
  document.getElementById('linkResult').classList.remove('show');
  document.getElementById('roomSection').style.display='block';
}
function selectRoom(r) {
  selectedRoom=r;
  document.querySelectorAll('.room-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('room-'+r).classList.add('selected');
  document.getElementById('selectedRoom').value=(currentBuilding?currentBuilding.label+'　':'')+r+' 室';
  document.getElementById('btnGenerate').disabled=false;
  document.getElementById('linkResult').classList.remove('show');
}
async function generateLink() {
  const pw=document.getElementById('lockPw').value.trim();
  const note=document.getElementById('adminNote').value.trim();
  if(!selectedRoom){alert('請先選擇房間');return;}
  if(!pw){alert('請輸入門鎖密碼');return;}
  const base=location.href.split('#')[0];
  const bldg=currentBuilding?currentBuilding.label:'';
  const sectionsEncoded=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(SECTIONS)))));
  let hash=`#clean/room=${encodeURIComponent(selectedRoom)}&bldg=${encodeURIComponent(bldg)}&pw=${encodeURIComponent(pw)}&s=${sectionsEncoded}`;
  if(note) hash+=`&note=${encodeURIComponent(note)}`;
  const fullUrl = base + hash;

  // Show result area with loading state
  const statusEl = document.getElementById('shortUrlStatus');
  const boxEl = document.getElementById('shortUrlBox');
  const copyBtn = document.getElementById('btnCopyShort');
  statusEl.textContent = '⏳ 產生短網址中...';
  boxEl.style.display = 'none';
  copyBtn.style.display = 'none';
  document.getElementById('linkResult').classList.add('show');

  try {
    const res = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(fullUrl)}`);
    if(!res.ok) throw new Error();
    const short = await res.text();
    if(!short.startsWith('http')) throw new Error();
    statusEl.textContent = '✅ 短網址已產生 — 複製後傳給清潔人員';
    boxEl.textContent = short;
    boxEl.style.display = 'block';
    copyBtn.style.display = 'block';
    copyBtn.textContent = '📋 複製短網址';
    copyBtn.classList.remove('copied');
  } catch(e) {
    statusEl.textContent = '❌ 短網址產生失敗，請重試';
  }
}

function copyShortUrl() {
  const url = document.getElementById('shortUrlBox').textContent;
  navigator.clipboard.writeText(url).then(()=>{
    const btn = document.getElementById('btnCopyShort');

/* ── Cleaner ── */
function showCleanerPage(params) {
  document.getElementById('page-admin').classList.remove('active');
  document.getElementById('page-cleaner').classList.add('active');
  const room=params.room||'—', bldg=params.bldg||'', pw=params.pw||'—', note=params.note||'';
  // Load sections from URL if present (admin's latest version)
  if(params.s) {
    try {
      SECTIONS = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(params.s)))));
    } catch(e) { console.warn('Failed to decode sections from URL', e); }
  }
  currentRoom=(bldg?bldg+' ':'')+room;
  const now=new Date();
  currentDate=now.getFullYear()+'/'+ String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0');
  document.getElementById('heroBuilding').textContent=bldg;
  document.getElementById('heroRoom').textContent=room+' 室';
  document.getElementById('heroPassword').textContent=pw;
  document.getElementById('heroDate').textContent=currentDate;
  const noteEl=document.getElementById('heroNote');
  if(note){noteEl.textContent='📌 '+note;noteEl.classList.add('show');}else{noteEl.classList.remove('show');}
  buildChecklist(); uploadedPhotos=[]; renderPhotoGrid(); setTgStatus('');
}
function buildChecklist() {
  checkStates={}; totalItems=0;
  const c=document.getElementById('cleanerSections'); c.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    if(sec.enabled===false) return;
    totalItems+=sec.items.length;
    sec.items.forEach((_,ii)=>{ checkStates[`${si}-${ii}`]=false; });
    const div=document.createElement('div'); div.className='cl-section';
    div.innerHTML=`
      <div class="cl-section-header" onclick="toggleSection(this.closest('.cl-section'))">
        <span class="cl-section-icon">${sec.icon}</span>
        <span class="cl-section-title">${esc(sec.title)}</span>
        <span class="cl-section-count" id="sc-${si}">0/${sec.items.length}</span>
        <span class="cl-section-chevron">▾</span>
      </div>
      <div class="cl-section-body">
      ${sec.items.map((item,ii)=>`
        <div class="check-item" id="ci-${si}-${ii}" onclick="toggleItem(${si},${ii})">
          <div class="check-box"><span class="checkmark">✓</span></div>
          <div class="check-content">
            <div class="check-name">${esc(item.name)}</div>
            ${item.note?`<div class="check-note">💡 ${esc(item.note)}</div>`:''}
          </div>
        </div>`).join('')}
      </div>`;
    c.appendChild(div);
  });
  updateProgress();
}
function toggleItem(si,ii) {
  const key=`${si}-${ii}`; checkStates[key]=!checkStates[key];
  document.getElementById(`ci-${si}-${ii}`).classList.toggle('done',checkStates[key]);
  updateSectionCount(si); updateProgress();
}
function updateSectionCount(si) {
  const el=document.getElementById(`sc-${si}`);
  if(!el) return;
  let done=0; SECTIONS[si].items.forEach((_,ii)=>{ if(checkStates[`${si}-${ii}`]) done++; });
  el.textContent=`${done}/${SECTIONS[si].items.length}`;
}
function updateProgress() {
  const done=Object.values(checkStates).filter(Boolean).length;
  const pct=totalItems?Math.round(done/totalItems*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${done} / ${totalItems} 項完成`;
  document.getElementById('doneBanner').classList.toggle('show',done===totalItems&&totalItems>0);
}
function resetAll() {
  if(!confirm('確定要重置所有勾選？')) return;
  Object.keys(checkStates).forEach(k=>{checkStates[k]=false;});
  document.querySelectorAll('.check-item').forEach(el=>el.classList.remove('done'));
  SECTIONS.forEach((_,si)=>updateSectionCount(si)); updateProgress();
}

/* ── 壓縮照片 ── */
function compressPhoto(file, maxW=1280, quality=0.82) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if(w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        // Use compressed only if smaller
        const result = blob && blob.size < file.size ? blob : file;
        resolve(new File([result], file.name || 'photo.jpg', {type:'image/jpeg'}));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

/* ── Upload single photo with XHR progress ── */
function uploadPhotoXHR(file, idx, caption) {
  return new Promise((resolve, reject) => {
    const thumb = document.getElementById(`photo-thumb-${idx}`);
    const pctEl  = document.getElementById(`upload-pct-${idx}`);
    const barEl  = document.getElementById(`upload-bar-${idx}`);
    const lblEl  = document.getElementById(`upload-label-${idx}`);
    const iconEl = document.getElementById(`upload-icon-${idx}`);

    if(thumb) { thumb.classList.remove('upload-done','upload-error'); thumb.classList.add('uploading'); }
    if(iconEl) iconEl.textContent = '⏳';

    const form = new FormData();
    form.append('chat_id', TG_CHAT);
    form.append('photo', file, file.name || `photo${idx+1}.jpg`);
    if(caption) form.append('caption', caption);

    const xhr = new XMLHttpRequest();
    let startTime = Date.now();

    xhr.upload.onprogress = (e) => {
      if(!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      const elapsed = (Date.now() - startTime) / 1000;
      const rate = elapsed > 0 ? e.loaded / elapsed : 0;
      const remaining = rate > 0 ? Math.ceil((e.total - e.loaded) / rate) : 0;
      const timeStr = remaining >= 60 ? `${Math.floor(remaining/60)}分${remaining%60}秒`
                    : remaining > 0   ? `${remaining}秒`
                    : '即將完成';
      if(pctEl) pctEl.textContent = pct + '%';
      if(barEl) barEl.style.width = pct + '%';
      if(lblEl) lblEl.textContent = pct < 100 ? `剩餘 ${timeStr}` : '處理中...';
    };

    xhr.onload = () => {
      try {
        const res = JSON.parse(xhr.responseText);
        if(res.ok) {
          if(thumb){ thumb.classList.remove('uploading'); thumb.classList.add('upload-done'); }
          if(iconEl) iconEl.textContent = '✅';
          if(pctEl) pctEl.textContent = '完成';
          if(lblEl) lblEl.textContent = '已上傳';
          if(barEl) barEl.style.width = '100%';
          resolve();
        } else throw new Error(res.description || '上傳失敗');
      } catch(e) {
        if(thumb){ thumb.classList.remove('uploading'); thumb.classList.add('upload-error'); }
        if(iconEl) iconEl.textContent = '❌';
        if(pctEl) pctEl.textContent = '失敗';
        if(lblEl) lblEl.textContent = e.message;
        reject(e);
      }
    };
    xhr.onerror = () => {
      if(thumb){ thumb.classList.remove('uploading'); thumb.classList.add('upload-error'); }
      if(iconEl) iconEl.textContent = '❌';
      if(pctEl) pctEl.textContent = '失敗';
      if(lblEl) lblEl.textContent = '網路錯誤';
      reject(new Error('網路錯誤'));
    };

    xhr.open('POST', `https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`);
    xhr.send(form);
  });
}

/* ── Retry state ── */
let failedPhotos = []; // [{idx, file, dataUrl}]
let lastTgMsg = '';

/* ── Main send ── */
async function sendToTelegram() {
  const done    = Object.values(checkStates).filter(Boolean).length;
  const caption = document.getElementById('photoCaption').value.trim();
  lastTgMsg = [`🏠 *${currentRoom} 清潔完成通知*`,`📅 日期：${currentDate}`,`✅ 完成項目：${done} / ${totalItems} 項`,caption?`📝 備註：${caption}`:'',uploadedPhotos.length?`📸 附圖：${uploadedPhotos.length} 張`:'（無附圖）'].filter(Boolean).join('\n');

  const btn = document.getElementById('btnSendTg');
  btn.disabled = true;
  failedPhotos = [];
  setTgStatus('sending','⏳ 傳送訊息中...');

  try {
    const tr = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT,text:lastTgMsg,parse_mode:'Markdown'})});
    const td = await tr.json();
    if(!td.ok) throw new Error(td.description||'訊息傳送失敗');
  } catch(err) {
    setTgStatus('error','❌ 傳送失敗：'+err.message);
    btn.disabled = false;
    return;
  }

  // Compress + upload each photo
  for(let i = 0; i < uploadedPhotos.length; i++) {
    setTgStatus('sending', `🗜️ 壓縮第 ${i+1} / ${uploadedPhotos.length} 張...`);
    let file;
    try { file = await compressPhoto(uploadedPhotos[i].file); }
    catch(e) { file = uploadedPhotos[i].file; }

    setTgStatus('sending', `📸 上傳第 ${i+1} / ${uploadedPhotos.length} 張照片...`);
    const photoCaption = i === 0 ? `📸 ${currentRoom} 清潔照片` : '';
    try {
      await uploadPhotoXHR(file, i, photoCaption);
    } catch(e) {
      failedPhotos.push({ idx: i, file, dataUrl: uploadedPhotos[i].dataUrl, name: `照片 ${i+1}` });
    }
  }

  btn.disabled = false;

  if(failedPhotos.length === 0) {
    setTgStatus('success', `✅ 全部傳送完成！${uploadedPhotos.length ? `（共 ${uploadedPhotos.length} 張）` : ''}`);
  } else {
    setTgStatus('error', `⚠️ ${failedPhotos.length} 張照片上傳失敗，訊息已送出`);
    showRetryModal();
  }
}

/* ── Retry modal ── */
function showRetryModal() {
  const list = document.getElementById('retryPhotoList');
  list.innerHTML = '';
  failedPhotos.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'retry-photo-item';
    item.innerHTML = `
      <img class="retry-photo-thumb" src="${p.dataUrl}" alt="${p.name}">
      <div class="retry-photo-info">
        <div class="retry-photo-name">${p.name}</div>
        <div class="retry-photo-status fail">上傳失敗</div>
      </div>
      <input type="checkbox" class="retry-check" id="retry-chk-${i}" checked>
    `;
    list.appendChild(item);
  });
  document.getElementById('retryOverlay').classList.add('show');
}

function closeRetry() {
  document.getElementById('retryOverlay').classList.remove('show');
  setTgStatus('success','✅ 訊息已送出（部分照片略過）');
}

async function doRetry() {
  document.getElementById('retryOverlay').classList.remove('show');
  const btn = document.getElementById('btnSendTg');
  btn.disabled = true;

  const toRetry = failedPhotos.filter((_,i) => {
    const chk = document.getElementById(`retry-chk-${i}`);
    return chk && chk.checked;
  });

  if(toRetry.length === 0) { closeRetry(); return; }

  const newFailed = [];
  for(let i = 0; i < toRetry.length; i++) {
    const p = toRetry[i];
    setTgStatus('sending', `🔄 重新上傳第 ${i+1} / ${toRetry.length} 張...`);
    const photoCaption = i === 0 ? `📸 ${currentRoom} 清潔照片（補傳）` : '';
    try {
      await uploadPhotoXHR(p.file, p.idx, photoCaption);
    } catch(e) {
      newFailed.push(p);
    }
  }

  failedPhotos = newFailed;
  btn.disabled = false;

  if(newFailed.length === 0) {
    setTgStatus('success', '✅ 全部照片補傳成功！');
  } else {
    setTgStatus('error', `⚠️ 仍有 ${newFailed.length} 張失敗`);
    showRetryModal();
  }
}
