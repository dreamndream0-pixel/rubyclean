<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套房退租清潔檢查表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2EC;
    --surface: #FFFDF8;
    --accent: #2D5016;
    --accent2: #8B6914;
    --text: #1A1A1A;
    --muted: #6B6B6B;
    --border: #D8D0C0;
    --check-done: #E8F0E0;
    --check-border: #4A7A25;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── Header ── */
  .page-header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--accent);
  }
  .page-header .label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .subtitle { font-size: 13px; color: var(--muted); }

  /* ── Info bar ── */
  .info-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .info-field {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .info-field label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
  }
  .info-field input {
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }

  /* ── Progress ── */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #5A9E35);
    border-radius: 999px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-text {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ── Section ── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-header {
    display: flex;
    align-items: center;
    padding: 13px 16px;
    gap: 10px;
    background: var(--accent);
    color: #fff;
  }
  .section-icon { font-size: 17px; }
  .section-title { font-size: 15px; font-weight: 700; flex: 1; }
  .section-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ── Items ── */
  .checklist { padding: 6px 0; }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item:hover { background: #F0EDE6; }
  .check-item.done { background: var(--check-done); }

  .check-box {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: #fff;
  }
  .check-item.done .check-box {
    background: var(--check-border);
    border-color: var(--check-border);
  }
  .checkmark { color: #fff; font-size: 12px; display: none; }
  .check-item.done .checkmark { display: block; }

  .check-content { flex: 1; }
  .check-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }
  .check-item.done .check-name {
    color: var(--muted);
    text-decoration: line-through;
  }
  .check-note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Notes ── */
  .notes-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .notes-section h3 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .notes-section textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    resize: vertical;
    min-height: 80px;
    outline: none;
  }

  /* ── Buttons ── */
  .btn-bar { display: flex; gap: 10px; margin-bottom: 8px; }
  .btn {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--border); color: var(--text); }

  /* ── Print ── */
  @media print {
    body { padding: 12px; background: #fff; max-width: 100%; }
    .btn-bar { display: none; }
    .info-field input { display: none; }
    .section { break-inside: avoid; }
  }

  /* ── Mobile tweaks ── */
  @media (max-width: 400px) {
    h1 { font-size: 20px; }
    .info-bar { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="label">Property Management</div>
  <h1>🏠 套房退租清潔檢查表</h1>
  <div class="subtitle">5–8 坪標準套房｜清潔人員用表</div>
</div>

<div class="info-bar">
  <div class="info-field">
    <label>房號 / 地址</label>
    <input type="text" placeholder="例：302室">
  </div>
  <div class="info-field">
    <label>清潔日期</label>
    <input type="date">
  </div>
  <div class="info-field">
    <label>清潔人員</label>
    <input type="text" placeholder="姓名">
  </div>
  <div class="info-field">
    <label>驗收人員</label>
    <input type="text" placeholder="姓名">
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
</div>

<div id="sections"></div>

<div class="notes-section">
  <h3>📝 備註 / 損壞紀錄</h3>
  <textarea placeholder="記錄損壞物品、需更換耗材、異常狀況等..."></textarea>
</div>

<div class="btn-bar">
  <button class="btn btn-secondary" onclick="resetAll()">重置全部</button>
  <button class="btn btn-primary" onclick="window.print()">列印 / 儲存PDF</button>
</div>

<script>
const SECTIONS = [
  {
    icon: "🚪", title: "玄關 & 門窗",
    items: [
      { name: "大門門板擦拭清潔", note: "含門把、門框、貓眼" },
      { name: "窗戶玻璃擦拭（內外）", note: "含紗窗清洗" },
      { name: "窗框、窗溝清潔" },
      { name: "窗簾拆洗或拍打除塵", note: "發霉過髒再送洗" },
    ]
  },
  {
    icon: "🛏", title: "臥室 / 主空間",
    items: [
      { name: "天花板蜘蛛網清除" },
      { name: "燈具外殼擦拭，燈管確認正常" },
      { name: "牆面污漬清除補漆", note: "指印、筆跡、油漬等" },
      { name: "插座、開關面板擦拭" },
      { name: "衣櫃內外擦拭清潔", note: "含層板、掛桿、抽屜" },
      { name: "床頭板、床架擦拭" },
      { name: "床墊擦拭、除塵", note: "防水套、保潔墊" },
      { name: "書桌、椅子擦拭" },
      { name: "地板掃地、拖地", note: "含床底、角落、踢腳板" },
      { name: "冷氣濾網清洗、外殼擦拭" },
      { name: "冷氣試運轉確認" },
    ]
  },
  {
    icon: "🚿", title: "衛浴間",
    items: [
      { name: "馬桶內外全面刷洗消毒", note: "含底座、水箱、沖水按鈕" },
      { name: "洗手台、水龍頭除垢擦亮" },
      { name: "鏡面擦拭無水痕" },
      { name: "淋浴間磁磚、牆面刷洗", note: "去除皂垢、霉斑" },
      { name: "蓮蓬頭通孔清洗", note: "過髒需更換" },
      { name: "排水孔清毛髮、除臭" },
      { name: "浴室門、門框擦拭" },
      { name: "置物架清潔" },
      { name: "抽風機／暖風機濾網清潔" },
      { name: "地板刷洗、去霉" },
    ]
  },
  {
    icon: "🍳", title: "廚房 / 流理台區",
    items: [
      { name: "流理台水槽內外刷洗" },
      { name: "水龍頭、皂垢清除" },
      { name: "爐台（瓦斯／電磁）油污去除" },
      { name: "抽油煙機濾網清洗、外殼擦拭" },
      { name: "廚具門片、把手擦拭" },
      { name: "櫥櫃內層清潔" },
      { name: "壁面、磁磚油污清除" },
      { name: "微波爐／小冰箱內外擦拭（如附）" },
      { name: "垃圾桶消毒清潔" },
      { name: "地板清洗" },
    ]
  },
  {
    icon: "🔌", title: "設備與家電確認",
    items: [
      { name: "冰箱清空除臭、內外擦拭", note: "含冷凍庫除霜" },
      { name: "洗衣機槽清洗、外觀擦拭", note: "換棉絮網" },
      { name: "電視遙控器功能確認" },
      { name: "網路設備（路由器）確認" },
      { name: "所有燈具開關正常" },
      { name: "插座數量與狀態確認" },
    ]
  },
  {
    icon: "🗑️", title: "最終收尾",
    items: [
      { name: "全室垃圾清空帶走" },
      { name: "舊房客遺留物清除或登記" },
      { name: "拍照存證（清潔後各區域）" },
      { name: "房門上鎖、鑰匙繳回" },
    ]
  }
];

const states = {};
let total = 0;

function init() {
  const container = document.getElementById('sections');
  SECTIONS.forEach((sec, si) => {
    total += sec.items.length;
    sec.items.forEach((_, ii) => { states[`${si}-${ii}`] = false; });

    const div = document.createElement('div');
    div.className = 'section';

    const itemsHTML = sec.items.map((item, ii) => `
      <div class="check-item" id="item-${si}-${ii}" onclick="toggle(${si},${ii})">
        <div class="check-box"><span class="checkmark">✓</span></div>
        <div class="check-content">
          <div class="check-name">${item.name}</div>
          ${item.note ? `<div class="check-note">💡 ${item.note}</div>` : ''}
        </div>
      </div>
    `).join('');

    div.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-count" id="count-${si}">0/${sec.items.length}</span>
      </div>
      <div class="checklist">${itemsHTML}</div>
    `;
    container.appendChild(div);
  });
  updateProgress();
}

function toggle(si, ii) {
  const key = `${si}-${ii}`;
  states[key] = !states[key];
  document.getElementById(`item-${si}-${ii}`).classList.toggle('done', states[key]);
  updateSectionCount(si);
  updateProgress();
}

function updateSectionCount(si) {
  let done = 0;
  SECTIONS[si].items.forEach((_, ii) => { if (states[`${si}-${ii}`]) done++; });
  document.getElementById(`count-${si}`).textContent = `${done}/${SECTIONS[si].items.length}`;
}

function updateProgress() {
  const done = Object.values(states).filter(Boolean).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} 項完成`;
}

function resetAll() {
  if (!confirm('確定要重置所有勾選？')) return;
  Object.keys(states).forEach(k => { states[k] = false; });
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('done'));
  SECTIONS.forEach((_, si) => updateSectionCount(si));
  updateProgress();
}

init();
document.querySelector('input[type=date]').valueAsDate = new Date();
</script>
</body>
</html>
