<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>套房清潔管理系統</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ===== 米白高級 × Apple 風 ===== */
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface2:#F7F5F1;
  --border:#EAE6DF;

  --accent:#C6A76B;
  --accent2:#8FAF7A;
  --danger:#D85C5C;

  --text:#1C1C1E;
  --muted:#8A8A8E;

  --radius:14px;
}

body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

/* ===== 共用卡片 ===== */
.form-card,
.cl-section,
.photo-upload-area,
.pw-card,
.progress-wrap,
.note-card{
  box-shadow:0 6px 20px rgba(0,0,0,0.04);
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--radius);
  transition:.25s;
}

.form-card:hover,
.cl-section:hover,
.pw-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

/* ===== ADMIN ===== */
#page-admin{display:block;padding:32px 20px 60px;max-width:520px;margin:0 auto}

.admin-logo{text-align:center;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.admin-logo .tag{font-size:10px;letter-spacing:4px;color:var(--accent)}
.admin-logo h1{font-size:22px;font-weight:900}
.admin-logo p{font-size:12px;color:var(--muted)}

.room-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:28px}

.room-btn{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 6px;
  cursor:pointer;
  font-family:'DM Mono';
}
.room-btn:hover{border-color:var(--accent);color:var(--accent)}
.room-btn.selected{background:var(--accent);color:#fff}

/* ===== 表單 ===== */
.field{margin-bottom:14px}
.field label{font-size:11px;color:var(--muted)}
.field input{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
}

/* ===== 主按鈕 ===== */
.btn-generate{
  width:100%;
  padding:16px;
  background:#1C1C1E;
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:700;
}

</style>
</head>

<body>

<div id="page-admin">
  <div class="admin-logo">
    <div class="tag">ADMIN</div>
    <h1>套房清潔管理</h1>
  </div>

  <div class="room-grid" id="roomGrid"></div>

  <div class="form-card" style="padding:20px">
    <div class="field">
      <label>房號</label>
      <input id="selectedRoom" readonly>
    </div>
    <div class="field">
      <label>密碼</label>
      <input id="lockPw">
    </div>
  </div>

  <button class="btn-generate" onclick="generateLink()">產生連結</button>

  <div id="linkBox" style="margin-top:10px"></div>
</div>

<script>
const ROOMS=['101','102','201','202','301','302','401','402','501','502']

function build(){
  const g=document.getElementById('roomGrid')
  ROOMS.forEach(r=>{
    const b=document.createElement('button')
    b.className='room-btn'
    b.innerText=r
    b.onclick=()=>{
      document.getElementById('selectedRoom').value=r
    }
    g.appendChild(b)
  })
}

function generateLink(){
  const r=document.getElementById('selectedRoom').value
  const pw=document.getElementById('lockPw').value
  const url=location.href+"#"+r+"-"+pw
  document.getElementById('linkBox').innerText=url
}

build()
</script>

</body>
</html>
